# rumdl, run by `make rumdl` on the Markdown files: its default rules, with lines of 100 columns
# at most, but in code blocks and tables.
[MD013]
line-length = 100
code-blocks = false
tables = false

# A pull request's template opens at `## Problem`, as atomic-commits §6 sets: GitHub shows the
# title above the description, which takes no other heading.
[per-file-ignores]
"**/pull_request_template.md" = ["MD041"]
