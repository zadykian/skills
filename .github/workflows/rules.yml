name: rules

# Checks each pull request against the rules of the atomic-commits and banned-terms skills, by the
# three checks of actions/ as the pull request has them. So a pull request that changes a rule, in
# its skill and its check, is checked by the check it makes. Each warns and never blocks, so no
# ruleset requires the job. banned-terms passes over the files that quote the terms on purpose.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

# Two runs of a pull request race to create each check's comment, so a newer event's run cancels
# the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: read
      contents: read
      pull-requests: write
    # zizmor asks for $/ over ./, but actionlint 1.7.12 refuses $/ as a uses ref. So the checkout
    # gives the job the checks' code, and each ./ step ignores the audit.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pull request's own head, as in the ci workflow, since it lands as it is.
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: ./actions/atomic-commits # zizmor: ignore[self-repository]
      - uses: ./actions/pr-description # zizmor: ignore[self-repository]
      - uses: ./actions/banned-terms # zizmor: ignore[self-repository]
        with:
          exclude: |
            .vale/styles/write-good/TooWordy.yml
            actions/banned-terms/README.md
            docs/lint.md
            skills/banned-terms/SKILL.md
            skills/banned-terms/terms.json
            tests/banned-terms.sh
