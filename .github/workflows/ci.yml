name: ci

# Every pull request, whatever its base, since pull requests are stacked, each on the one below it.
# On main, each push: GitHub's merge pushes one as each pull request lands.
on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  # make lint, the one gate, with the tools tools/run pins and the claude .github/claude pins, whose
  # plugin validate checks the marketplace and the skills. Any finding fails it, warnings
  # included.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request's own head, rather than GitHub's test merge of it. The head lands as it
          # is: its commits go under a merge commit whose tree is the head's, as main's ruleset
          # requires the branch to be up to date. The whole history, which brings the tags too:
          # gitleaks scans every commit, and the version check reads the last release's tag.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # The claude of .github/claude's lockfile, each package checked against its integrity hash.
      # No package's script runs but claude's own postinstall, which copies the platform's binary
      # from its package over the stub that bin/claude.exe is until then.
      - name: Install claude
        run: |
          npm ci --prefix .github/claude --ignore-scripts --no-fund --no-audit
          node .github/claude/node_modules/@anthropic-ai/claude-code/install.cjs
          .github/claude/node_modules/.bin/claude --version
      - name: make lint
        run: make lint CLAUDE=.github/claude/node_modules/.bin/claude
        env:
          # zizmor's online audits, which look the actions up on GitHub, need a token.
          GH_TOKEN: ${{ github.token }}

  # make test: the cases of each tests/NAME.sh, against the fake gh.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pull request's own head, as in the lint job, since its tree is the tree that lands.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: make test
