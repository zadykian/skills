name: release

# Publishes the marketplace's version as a GitHub Release with its tag, vX.Y.Z, once a raise of it
# lands on main. gh skill installs the latest release unless told another. GitHub's merge of a
# pull request pushes to main, and that push starts this workflow. So does a push by hand.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      # A version is released once, where no tag of its name is yet. tools/versioncheck refuses a
      # raise that the commits since the last release do not call for, and nothing is published
      # then. The notes list those commits, as tools/releasenotes writes them. The token may not
      # tag a commit whose workflows differ from main's, so the tag is at main's head. Its target
      # is the SHA checked out, as main may since have moved past the commits that the notes list.
      - name: Release the version
        run: |
          version=$(jq -r .metadata.version .claude-plugin/marketplace.json)
          if git rev-parse --verify --quiet "refs/tags/v$version" >/dev/null; then
            echo "v$version is released."
            exit 0
          fi
          tools/versioncheck
          tools/releasenotes >"$RUNNER_TEMP/notes.md"
          gh release create "v$version" --repo "$GITHUB_REPOSITORY" --title "v$version" \
            --target "$(git rev-parse HEAD)" --notes-file "$RUNNER_TEMP/notes.md"
        env:
          GH_TOKEN: ${{ github.token }}
