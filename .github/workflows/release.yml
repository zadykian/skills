name: release

# Publishes each version of the marketplace on main as a GitHub Release with its tag, vX.Y.Z, at
# the last commit that shipped it, where no tag of that name is yet. gh skill installs the latest
# release unless told another. The fast-forward workflow's pushes start no workflow, so its runs
# that complete start this one. A push to main by hand starts it too.

on:
  push:
    branches: [main]
  # zizmor: ignore[dangerous-triggers] the job reads main alone, never a pull request's code.
  workflow_run:
    workflows: [fast-forward]
    types: [completed]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release

jobs:
  release:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      # A version ships at the last commit that changed the bundles while the marketplace gave
      # that version, as the next change raises it. Its notes are CHANGELOG.md's section there.
      - name: Release the new versions
        run: |
          catalog=.claude-plugin/marketplace.json
          for sha in $(git log --reverse --format=%H -- skills hooks .claude-plugin); do
            version=$(git show "$sha:$catalog" 2>/dev/null | jq -r '.metadata.version // empty') ||
              version=
            [ -z "$version" ] || printf '%s %s\n' "$version" "$sha"
          done | awk '!($1 in at) { order[++n] = $1 } { at[$1] = $2 }
            END { for (i = 1; i <= n; i++) print order[i], at[order[i]] }' >"$RUNNER_TEMP/versions"
          while read -r version sha; do
            tag=v$version
            if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
              continue
            fi
            git show "$sha:CHANGELOG.md" | awk -v heading="## $version" \
              '$0 == heading { on = 1; next } on && /^## / { exit } on' >"$RUNNER_TEMP/notes.md"
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$sha" --title "$tag" \
              --notes-file "$RUNNER_TEMP/notes.md"
          done <"$RUNNER_TEMP/versions"
        env:
          GH_TOKEN: ${{ github.token }}
